<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tenis para dos</title>
<style>
  html,body{margin:0;height:100%;background:#1b5e20;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
  canvas{display:block;width:100vw;height:100dvh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Tenis para dos: cada jugador arrastra el dedo en SU mitad de la pantalla (también hacia delante, hasta la red).
// Abajo: Jugador 1. Arriba: Jugador 2 (sus textos salen girados para leerlos desde arriba).
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const WIN = 5, MARG = 24, FINGER_OFFSET = 46;
let W, H, dpr;
function resize(){
  dpr = window.devicePixelRatio || 1;
  const r = cv.getBoundingClientRect(); W = r.width; H = r.height;
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize', resize); resize();

// a, b = semiancho y semialto de la raqueta
const RACKETS = [
  {name:'Clásica',  shape:'rect',    a:60, b:7,  color:'#42a5f5'},
  {name:'Redonda',  shape:'ellipse', a:28, b:28, color:'#ef5350'},
  {name:'Ovalada',  shape:'ellipse', a:54, b:15, color:'#ffb300'},
  {name:'Rombo',    shape:'diamond', a:50, b:22, color:'#ab47bc'},
  {name:'Cuadrada', shape:'rect',    a:26, b:26, color:'#26c6da'},
  {name:'Mini',     shape:'ellipse', a:18, b:18, color:'#ec407a'},
];
const p = [ {x:0,y:0,tx:0,ty:0,score:0,r:0,ready:false}, {x:0,y:0,tx:0,ty:0,score:0,r:1,ready:false} ]; // 0 = abajo, 1 = arriba
const ball = {x:0,y:0,vx:0,vy:0,r:10};
let state = 'menu';      // menu | serve | play | over
let server = 0, winner = -1, lockUntil = 0;
const k = () => Math.min(1, W/420);
const size = i => ({a: RACKETS[p[i].r].a*k(), b: RACKETS[p[i].r].b*k()});

function reset(){ p[0].score=p[1].score=0; server=0; winner=-1; toServe(); }
function toServe(){
  p[0].x=p[0].tx=W/2; p[0].y=p[0].ty=H-60;
  p[1].x=p[1].tx=W/2; p[1].y=p[1].ty=60;
  ball.x=W/2; ball.y=H/2; ball.vx=ball.vy=0;
  state='serve'; lockUntil = performance.now()+400;
}
function launch(){
  const sp = H*0.55;
  ball.vy = (server===0?-1:1)*sp;
  ball.vx = (Math.random()-.5)*W*0.6;
  state='play';
}
function point(who){
  p[who].score++;
  if (p[who].score>=WIN){ winner=who; state='over'; lockUntil = performance.now()+800; return; }
  server = 1-who; // saca quien perdió el punto
  toServe();
}

// ---------- Selector de raqueta (se dibuja en la mitad de abajo; la de arriba se gira) ----------
function layout(){
  const cw = Math.min((W-32)/3, 110), gx = (W-cw*3)/2, top = H/2+56;
  const ch = Math.max(56, Math.min(80, (H/2-56-84)/2 - 8));
  const cells = RACKETS.map((_,j)=>({x:gx+(j%3)*cw+4, y:top+Math.floor(j/3)*(ch+8), w:cw-8, h:ch}));
  return {cells, btn:{x:W/2-95, y:H-74, w:190, h:48}};
}
const inside = (r,x,y) => x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+r.h;

function tapPicker(i,x,y){
  if (i===1){ x=W-x; y=H-y; }
  const L = layout();
  L.cells.forEach((c,j)=>{ if (inside(c,x,y)){ p[i].r=j; p[i].ready=false; } });
  if (inside(L.btn,x,y)) p[i].ready = !p[i].ready;
  if (p[0].ready && p[1].ready){ p[0].ready=p[1].ready=false; reset(); lockUntil = performance.now()+500; }
}

// ---------- Entrada ----------
const owner = {};
function local(t){ const r = cv.getBoundingClientRect(); return {x:t.clientX-r.left, y:t.clientY-r.top}; }
function aim(i,x,y){ p[i].tx = x; p[i].ty = i===0 ? y-FINGER_OFFSET : y+FINGER_OFFSET; }
function tap(x,y){
  if (performance.now() < lockUntil) return;
  if (state==='menu') tapPicker(y>H/2?0:1, x, y);
  else if (state==='over') state='menu';
  else if (state==='serve') launch();
}
cv.addEventListener('touchstart', e=>{
  e.preventDefault();
  for (const t of e.changedTouches){
    const l = local(t), i = l.y>H/2?0:1;
    owner[t.identifier] = i; aim(i,l.x,l.y); tap(l.x,l.y);
  }
}, {passive:false});
cv.addEventListener('touchmove', e=>{
  e.preventDefault();
  for (const t of e.changedTouches){
    const i = owner[t.identifier]; if (i===undefined) continue;
    const l = local(t); aim(i,l.x,l.y);
  }
}, {passive:false});
const endTouch = e => { for (const t of e.changedTouches) delete owner[t.identifier]; };
cv.addEventListener('touchend', endTouch); cv.addEventListener('touchcancel', endTouch);
// ratón para probar en ordenador
cv.addEventListener('mousemove', e=>{ const l = local(e); aim(l.y>H/2?0:1, l.x, l.y); });
cv.addEventListener('mousedown', e=>{ const l = local(e); tap(l.x,l.y); });

// ---------- Juego ----------
function hitShape(shape,a,b,dx,dy,r){
  if (shape==='rect') return Math.abs(dx)<a+r && Math.abs(dy)<b+r;
  if (shape==='ellipse') return (dx/(a+r))**2 + (dy/(b+r))**2 < 1;
  return Math.abs(dx)/(a+r) + Math.abs(dy)/(b+r) < 1; // rombo
}
let last = performance.now();
function loop(now){
  const dt = Math.min(0.033,(now-last)/1000); last = now;
  update(dt); draw(); requestAnimationFrame(loop);
}
function update(dt){
  for (let i=0;i<2;i++){
    const q = p[i], {a,b} = size(i), f = Math.min(1, dt*25);
    q.x += (q.tx-q.x)*f; q.y += (q.ty-q.y)*f;
    q.x = Math.max(a, Math.min(W-a, q.x));
    q.y = i===0 ? Math.max(H/2+b+MARG, Math.min(H-28-b, q.y))
                : Math.max(28+b, Math.min(H/2-b-MARG, q.y));
  }
  if (state!=='play') return;
  const steps = 4, sdt = dt/steps;
  for (let s=0;s<steps;s++){
    ball.x += ball.vx*sdt; ball.y += ball.vy*sdt;
    if (ball.x < ball.r){ ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x > W-ball.r){ ball.x = W-ball.r; ball.vx = -Math.abs(ball.vx); }
    for (let i=0;i<2;i++){
      const q = p[i], {a,b} = size(i), dir = i===0 ? -1 : 1;
      const toward = i===0 ? ball.vy>0 : ball.vy<0;
      if (toward && hitShape(RACKETS[q.r].shape, a, b, ball.x-q.x, ball.y-q.y, ball.r)){
        const off = Math.max(-1, Math.min(1, (ball.x-q.x)/Math.max(a,1))); // según dónde golpees
        const speed = Math.min(Math.hypot(ball.vx,ball.vy)*1.06, H*1.4);
        ball.vx = off*speed*0.7;
        ball.vy = dir*Math.sqrt(Math.max(speed*speed-ball.vx*ball.vx, (speed*0.4)**2));
        ball.y = q.y + dir*(b+ball.r);
        if (navigator.vibrate) navigator.vibrate(15);
      }
    }
    if (ball.y > H+20){ point(1); return; }
    if (ball.y < -20){ point(0); return; }
  }
}

function drawRacket(x,y,R,a,b){
  ctx.fillStyle = R.color; ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2;
  ctx.beginPath();
  if (R.shape==='rect') ctx.roundRect(x-a, y-b, a*2, b*2, Math.min(b,8));
  else if (R.shape==='ellipse') ctx.ellipse(x, y, a, b, 0, 0, Math.PI*2);
  else { ctx.moveTo(x,y-b); ctx.lineTo(x+a,y); ctx.lineTo(x,y+b); ctx.lineTo(x-a,y); ctx.closePath(); }
  ctx.fill(); ctx.stroke();
}

function drawPicker(i){
  ctx.save();
  if (i===1){ ctx.translate(W/2,H/2); ctx.rotate(Math.PI); ctx.translate(-W/2,-H/2); }
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#fff'; ctx.font='bold 20px sans-serif';
  ctx.fillText('Jugador '+(i+1)+' · elige tu raqueta', W/2, H/2+30);
  const L = layout();
  L.cells.forEach((c,j)=>{
    const sel = p[i].r===j, R = RACKETS[j];
    ctx.fillStyle = sel ? 'rgba(255,255,255,.3)' : 'rgba(0,0,0,.28)';
    ctx.beginPath(); ctx.roundRect(c.x,c.y,c.w,c.h,12); ctx.fill();
    if (sel){ ctx.strokeStyle='#ffeb3b'; ctx.lineWidth=3; ctx.stroke(); }
    const s = Math.min(1, (c.w*0.75)/(R.a*2), (c.h*0.5)/(R.b*2));
    drawRacket(c.x+c.w/2, c.y+c.h*0.4, R, R.a*s, R.b*s);
    ctx.fillStyle='#fff'; ctx.font='12px sans-serif'; ctx.fillText(R.name, c.x+c.w/2, c.y+c.h-11);
  });
  const b = L.btn, ready = p[i].ready;
  ctx.fillStyle = ready ? '#66bb6a' : '#ffeb3b';
  ctx.beginPath(); ctx.roundRect(b.x,b.y,b.w,b.h,24); ctx.fill();
  ctx.fillStyle = '#1b1b1b'; ctx.font='bold 17px sans-serif';
  ctx.fillText(ready ? 'Listo · esperando…' : 'LISTO', b.x+b.w/2, b.y+b.h/2);
  ctx.restore();
}

function draw(){
  // pista
  ctx.fillStyle='#2e7d32'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#388e3c'; ctx.fillRect(0,0,W,H/2);
  ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=3;
  ctx.strokeRect(12,12,W-24,H-24);
  ctx.setLineDash([14,10]); ctx.beginPath(); ctx.moveTo(12,H/2); ctx.lineTo(W-12,H/2); ctx.stroke(); ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(W/2,H*0.25); ctx.lineTo(W/2,H*0.75); ctx.stroke();

  if (state==='menu'){
    ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(0,0,W,H);
    drawPicker(0); drawPicker(1);
    return;
  }

  // marcador (el de arriba se dibuja girado)
  ctx.fillStyle='rgba(255,255,255,.35)'; ctx.font='bold 64px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(p[0].score, W-50, H/2+50);
  ctx.save(); ctx.translate(50, H/2-50); ctx.rotate(Math.PI); ctx.fillText(p[1].score,0,0); ctx.restore();

  // raquetas y pelota
  for (let i=0;i<2;i++){ const {a,b} = size(i); drawRacket(p[i].x, p[i].y, RACKETS[p[i].r], a, b); }
  ctx.fillStyle='#e6ff3b'; ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,7); ctx.fill();

  if (state==='serve') overlay(null, null, 'Saca el Jugador '+(server+1)+' · toca para sacar');
  else if (state==='over') overlay('¡Gana el Jugador '+(winner+1)+'!', p[0].score+' - '+p[1].score, 'Toca para volver a elegir raqueta');
}

// texto central; se muestra duplicado girado para que lo lean ambos jugadores
function overlay(big, mid, small){
  for (const rot of [0,1]){
    ctx.save(); ctx.translate(W/2, H/2); if (rot) ctx.rotate(Math.PI);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const dy = 70;
    if (big){ ctx.fillStyle='#fff'; ctx.font='bold 38px sans-serif'; ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=5;
      ctx.strokeText(big,0,dy-48); ctx.fillText(big,0,dy-48); }
    if (mid){ ctx.fillStyle='#fff'; ctx.font='18px sans-serif'; ctx.fillText(mid,0,dy-10); }
    ctx.fillStyle='#ffeb3b'; ctx.font='bold 17px sans-serif'; ctx.fillText(small,0,dy+22);
    ctx.restore();
  }
}
requestAnimationFrame(loop);
</script>
</body>
</html>
