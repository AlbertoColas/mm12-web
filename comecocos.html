<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Come cocos</title>
<style>
  html,body{margin:0;height:100%;background:#05051a;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;font-family:ui-monospace,Menlo,Consolas,monospace}
  canvas{display:block;width:100vw;height:100dvh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Come cocos: joystick abajo (o desliza el dedo por el laberinto) para girar. Para 1 jugador o 2 por turnos (gana quien más puntos haga).
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const MAZE = [
  '###############',
  '#......#......#',
  '#o##.#.#.#.##o#',
  '#.............#',
  '#.##.#####.##.#',
  '#....#...#....#',
  '####.#.#.#.####',
  '#.............#',
  '#.####.#.####.#',
  '#.............#',
  '####.#.#.#.####',
  '#....#...#....#',
  '#.##.#####.##.#',
  '#......P......#',
  '#o##.#.#.#.##o#',
  '#......#......#',
  '###############',
];
const COLS = MAZE[0].length, ROWS = MAZE.length;
const PAC_START = {x:7, y:13};
const GHOSTS = [
  {color:'#ff3b3b', x:7, y:7, delay:1.5, wander:.12, kind:'chase'},
  {color:'#ff8fd0', x:6, y:7, delay:3,   wander:.2,  kind:'ahead'},
  {color:'#3be6ff', x:8, y:7, delay:5,   wander:.35, kind:'chase'},
  {color:'#ffb347', x:5, y:7, delay:7,   wander:.25, kind:'shy'},
];
const DIRS = {L:[-1,0], R:[1,0], U:[0,-1], D:[0,1]};
const ALL_DIRS = [[1,0],[-1,0],[0,1],[0,-1]];
const isWall = (x,y) => x<0 || y<0 || x>=COLS || y>=ROWS || MAZE[y][x]==='#';

let W, H, dpr, ts, ox, oy, hudH = 64, joyH = 0;
const joy = {cx:0, cy:0, R:0, id:null, kx:0, ky:0};
function resize(){
  dpr = window.devicePixelRatio || 1;
  const r = cv.getBoundingClientRect(); W = r.width; H = r.height;
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  joyH = Math.min(190, Math.round(H*0.26));
  ts = Math.floor(Math.min(W/COLS, (H-hudH-joyH-12)/ROWS));
  ox = Math.floor((W-ts*COLS)/2); oy = Math.floor(hudH + (H-hudH-joyH-ts*ROWS)/2);
  joy.cx = W/2; joy.cy = H-joyH/2-4; joy.R = Math.min(64, joyH/2-8); joy.kx = joy.cx; joy.ky = joy.cy;
}
addEventListener('resize', resize); resize();

// ---------- Estado ----------
let mode = 'menu';   // menu | ready | play | dying | levelup | handoff | result
let nPlayers = 1, cur = 0, results = [0,0];
let score, lives, level, pel, pelLeft, fright, combo, timer, lockUntil = 0, t = 0;
let pac, ghosts, want = null, popups = [];

function freshPellets(){
  pel = MAZE.map(row => [...row].map(c => c==='.' ? 1 : c==='o' ? 2 : 0));
  pelLeft = pel.flat().filter(v=>v).length;
}
function resetPositions(){
  pac = {x:PAC_START.x, y:PAC_START.y, dx:0, dy:0, open:0, face:[1,0]};
  ghosts = GHOSTS.map(g => ({...g, x:g.x, y:g.y, dx:0, dy:0, wait:0, home:{x:g.x,y:g.y}}));
  want = null; fright = 0; combo = 0; popups = [];
}
function startRun(){
  score = 0; lives = 3; level = 1; freshPellets(); resetPositions(); mode = 'ready';
  lock(400);
}
function lock(ms){ lockUntil = performance.now()+ms; }
function endRun(){
  results[cur] = score;
  if (nPlayers===2 && cur===0){ cur = 1; mode = 'handoff'; }
  else mode = 'result';
  lock(800);
}
const pacSpeed = () => 5.6;
const ghostSpeed = () => Math.min(6, 4.5 + (level-1)*0.25);

// ---------- Movimiento por casillas ----------
function stepEntity(e, dist, choose){
  let guard = 0;
  while (dist > 1e-9 && guard++ < 8){
    const cx = Math.round(e.x), cy = Math.round(e.y);
    const centered = Math.abs(e.x-cx)<1e-6 && Math.abs(e.y-cy)<1e-6;
    if (centered){ e.x=cx; e.y=cy; choose(e,cx,cy); if (!e.dx && !e.dy) return; }
    let toNext;
    if (centered) toNext = 1;
    else if (e.dx) toNext = e.dx>0 ? Math.ceil(e.x-1e-9)-e.x : e.x-Math.floor(e.x+1e-9);
    else toNext = e.dy>0 ? Math.ceil(e.y-1e-9)-e.y : e.y-Math.floor(e.y+1e-9);
    const m = Math.min(dist, toNext);
    e.x += e.dx*m; e.y += e.dy*m; dist -= m;
  }
}
function pacChoose(e,cx,cy){
  eat(cx,cy);
  if (want && !isWall(cx+want[0], cy+want[1])){ e.dx=want[0]; e.dy=want[1]; e.face=[e.dx,e.dy]; }
  else if ((e.dx||e.dy) && isWall(cx+e.dx, cy+e.dy)){ e.dx=0; e.dy=0; }
}
function eat(cx,cy){
  const v = pel[cy][cx]; if (!v) return;
  pel[cy][cx] = 0; pelLeft--;
  if (v===1) score += 10;
  else {
    score += 50; fright = 7; combo = 0;
    for (const g of ghosts) if (!g.wait && (g.dx||g.dy)){ g.dx=-g.dx; g.dy=-g.dy; }
  }
}
function ghostChoose(g,cx,cy){
  let opts = ALL_DIRS.filter(d => !isWall(cx+d[0],cy+d[1]) && !(d[0]===-g.dx && d[1]===-g.dy));
  if (!opts.length) opts = ALL_DIRS.filter(d => !isWall(cx+d[0],cy+d[1]));
  let pick;
  if (fright>0 || Math.random() < Math.max(.05, g.wander - (level-1)*.02)) pick = opts[Math.floor(Math.random()*opts.length)];
  else {
    let tx = pac.x, ty = pac.y;
    if (g.kind==='ahead'){ tx += pac.face[0]*3; ty += pac.face[1]*3; }
    if (g.kind==='shy' && Math.hypot(pac.x-cx, pac.y-cy) < 6){ tx = 1; ty = ROWS-2; }
    let best = 1e9;
    for (const d of opts){
      const dd = (cx+d[0]-tx)**2 + (cy+d[1]-ty)**2;
      if (dd < best){ best = dd; pick = d; }
    }
  }
  g.dx = pick[0]; g.dy = pick[1];
}

function update(dt){
  t += dt;
  for (const p of popups) p.t -= dt;
  popups = popups.filter(p => p.t>0);
  if (mode==='dying'){ timer -= dt; if (timer<=0){ if (lives>0){ resetPositions(); mode='play'; } else endRun(); } return; }
  if (mode==='levelup'){ timer -= dt; if (timer<=0){ level++; freshPellets(); resetPositions(); mode='ready'; lock(300); } return; }
  if (mode!=='play') return;
  fright = Math.max(0, fright-dt);
  if (pac.dx||pac.dy) pac.open += dt*14;
  stepEntity(pac, pacSpeed()*dt, pacChoose);
  for (const g of ghosts){
    if (g.wait>0){ g.wait -= dt; continue; }
    if (g.delay>0){ g.delay -= dt; continue; }
    stepEntity(g, (fright>0 ? 3.2 : ghostSpeed())*dt, ghostChoose);
  }
  if (pelLeft<=0){ score += 500; mode='levelup'; timer=1.6; return; }
  for (const g of ghosts){
    if (g.wait>0) continue;
    if (Math.hypot(g.x-pac.x, g.y-pac.y) < 0.7){
      if (fright>0){
        combo++; const pts = 100*2**combo; score += pts;
        popups.push({x:g.x, y:g.y, t:1, text:String(pts)});
        g.x=g.home.x; g.y=g.home.y; g.dx=g.dy=0; g.wait=3;
      } else {
        lives--; mode='dying'; timer=1.4;
        if (navigator.vibrate) navigator.vibrate(120);
        return;
      }
    }
  }
}

// ---------- Entrada ----------
function setWant(d){
  want = d;
  if ((pac.dx||pac.dy) && pac.dx===-d[0] && pac.dy===-d[1]){ pac.dx=-pac.dx; pac.dy=-pac.dy; pac.face=[pac.dx,pac.dy]; }
}
function buttons(){
  const w = Math.min(W-48, 300);
  return [
    {n:1, label:'1 JUGADOR', x:(W-w)/2, y:H*0.5, w, h:54},
    {n:2, label:'2 JUGADORES · POR TURNOS', x:(W-w)/2, y:H*0.5+72, w, h:54},
  ];
}
function tap(x,y){
  if (performance.now() < lockUntil) return;
  if (mode==='menu'){
    for (const b of buttons()) if (x>=b.x && x<=b.x+b.w && y>=b.y && y<=b.y+b.h){ nPlayers=b.n; cur=0; results=[0,0]; startRun(); }
  } else if (mode==='ready') mode='play';
  else if (mode==='handoff') startRun();
  else if (mode==='result') mode='menu';
}
let sx=0, sy=0, tid=null;
function joyMove(x,y){
  let dx = x-joy.cx, dy = y-joy.cy; const d = Math.hypot(dx,dy);
  if (d > joy.R){ dx *= joy.R/d; dy *= joy.R/d; }
  joy.kx = joy.cx+dx; joy.ky = joy.cy+dy;
  if (d > joy.R*0.3){
    setWant(Math.abs(dx)>Math.abs(dy) ? (dx>0?DIRS.R:DIRS.L) : (dy>0?DIRS.D:DIRS.U));
    if (mode==='ready') mode='play';
  }
}
function joyRelease(){ joy.id = null; joy.kx = joy.cx; joy.ky = joy.cy; }
const inJoyZone = y => y > H-joyH-8 && mode!=='menu';
const local = t => { const r = cv.getBoundingClientRect(); return {x:t.clientX-r.left, y:t.clientY-r.top}; };
cv.addEventListener('touchstart', e=>{
  e.preventDefault();
  const t0 = e.changedTouches[0], l = local(t0);
  tap(l.x,l.y);
  if (inJoyZone(l.y) && joy.id===null){ joy.id = t0.identifier; joyMove(l.x,l.y); }
  else { tid = t0.identifier; sx = l.x; sy = l.y; }
}, {passive:false});
cv.addEventListener('touchmove', e=>{
  e.preventDefault();
  for (const t1 of e.changedTouches){
    if (t1.identifier===joy.id){ const l = local(t1); joyMove(l.x,l.y); continue; }
    if (t1.identifier!==tid) continue;
    const l = local(t1), dx = l.x-sx, dy = l.y-sy;
    if (Math.max(Math.abs(dx),Math.abs(dy)) > 16){
      setWant(Math.abs(dx)>Math.abs(dy) ? (dx>0?DIRS.R:DIRS.L) : (dy>0?DIRS.D:DIRS.U));
      if (mode==='ready') mode='play';
      sx = l.x; sy = l.y;
    }
  }
}, {passive:false});
const endTouch = e => { for (const t1 of e.changedTouches){ if (t1.identifier===joy.id) joyRelease(); if (t1.identifier===tid) tid = null; } };
cv.addEventListener('touchend', endTouch); cv.addEventListener('touchcancel', endTouch);
// ratón para probar en ordenador
cv.addEventListener('mousedown', e=>{ const l = local(e); tap(l.x,l.y); if (inJoyZone(l.y)){ joy.id = 'mouse'; joyMove(l.x,l.y); } });
addEventListener('mousemove', e=>{ if (joy.id==='mouse'){ const l = local(e); joyMove(l.x,l.y); } });
addEventListener('mouseup', ()=>{ if (joy.id==='mouse') joyRelease(); });
addEventListener('keydown', e=>{
  const d = {ArrowLeft:DIRS.L, ArrowRight:DIRS.R, ArrowUp:DIRS.U, ArrowDown:DIRS.D}[e.key];
  if (d){ e.preventDefault(); setWant(d); if (mode==='ready') mode='play'; }
  else if (e.key===' ' || e.key==='Enter'){ tap(W/2, H*0.5+10); }
});

// ---------- Dibujo ----------
function draw(){
  ctx.fillStyle = '#05051a'; ctx.fillRect(0,0,W,H);
  if (mode==='menu'){ drawMenu(); return; }
  drawHud(); drawMaze(); drawJoystick();
  for (const g of ghosts) drawGhost(g);
  drawPac();
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font = `bold ${Math.round(ts*0.6)}px ui-monospace,monospace`;
  for (const p of popups){ ctx.fillStyle='#5cf'; ctx.fillText(p.text, ox+(p.x+.5)*ts, oy+(p.y+.5)*ts - (1-p.t)*ts*.6); }
  if (mode==='ready') overlay('JUGADOR '+(cur+1), 'Mueve el joystick para empezar');
  else if (mode==='levelup') overlay('¡NIVEL SUPERADO!', '+500 puntos');
  else if (mode==='handoff') overlay('TURNO DEL JUGADOR 2', 'Jugador 1 ha hecho '+results[0]+' · toca para empezar');
  else if (mode==='result') resultScreen();
}
function drawHud(){
  ctx.textBaseline='middle'; ctx.textAlign='left'; ctx.fillStyle='#fff'; ctx.font='bold 18px ui-monospace,monospace';
  const top = 30;
  ctx.fillText((nPlayers===2 ? 'J'+(cur+1)+'  ' : '') + String(score).padStart(5,'0'), 16, top);
  ctx.textAlign='center'; ctx.fillStyle='#8ea0ff'; ctx.font='14px ui-monospace,monospace';
  ctx.fillText('NIVEL '+level, W/2, top);
  for (let i=0;i<lives;i++){
    drawPacShape(W-28-i*26, top, 9, 0.5, 0);
  }
}
function drawJoystick(){
  const {cx,cy,R} = joy;
  ctx.fillStyle='rgba(85,103,255,.12)'; ctx.strokeStyle='#5567ff'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.fill(); ctx.stroke();
  ctx.fillStyle='rgba(142,160,255,.7)';
  const a = R*0.72, s = R*0.13;
  for (const [dx,dy] of ALL_DIRS){
    const px = cx+dx*a, py = cy+dy*a;
    ctx.beginPath(); ctx.moveTo(px+dx*s, py+dy*s); ctx.lineTo(px-dx*s-dy*s, py-dy*s+dx*s); ctx.lineTo(px-dx*s+dy*s, py-dy*s-dx*s); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = joy.id!==null ? '#ffe600' : 'rgba(255,230,0,.75)';
  ctx.beginPath(); ctx.arc(joy.kx, joy.ky, R*0.42, 0, 7); ctx.fill();
}
function drawMaze(){
  for (let y=0;y<ROWS;y++) for (let x=0;x<COLS;x++){
    const px = ox+x*ts, py = oy+y*ts;
    if (MAZE[y][x]==='#'){
      ctx.fillStyle='#0c1560'; ctx.fillRect(px,py,ts,ts);
      ctx.strokeStyle='#5567ff'; ctx.lineWidth=2; ctx.beginPath();
      if (!isWall(x,y-1)){ ctx.moveTo(px,py+1); ctx.lineTo(px+ts,py+1); }
      if (!isWall(x,y+1)){ ctx.moveTo(px,py+ts-1); ctx.lineTo(px+ts,py+ts-1); }
      if (!isWall(x-1,y)){ ctx.moveTo(px+1,py); ctx.lineTo(px+1,py+ts); }
      if (!isWall(x+1,y)){ ctx.moveTo(px+ts-1,py); ctx.lineTo(px+ts-1,py+ts); }
      ctx.stroke();
    } else if (pel[y][x]){
      ctx.fillStyle='#ffe9b0'; ctx.beginPath();
      const big = pel[y][x]===2, r = big ? ts*0.26*(0.85+0.15*Math.sin(t*8)) : ts*0.09;
      ctx.arc(px+ts/2, py+ts/2, r, 0, 7); ctx.fill();
    }
  }
}
function drawPacShape(cx,cy,r,mouth,ang){
  ctx.fillStyle='#ffe600'; ctx.beginPath(); ctx.moveTo(cx,cy);
  ctx.arc(cx,cy,r,ang+mouth,ang+Math.PI*2-mouth); ctx.closePath(); ctx.fill();
}
function drawPac(){
  const cx = ox+(pac.x+.5)*ts, cy = oy+(pac.y+.5)*ts, r = ts*0.42;
  const ang = Math.atan2(pac.face[1], pac.face[0]);
  let mouth = 0.05 + 0.3*Math.abs(Math.sin(pac.open));
  if (mode==='dying') mouth = Math.min(Math.PI, (1.4-timer)/1.4*Math.PI*1.1);
  drawPacShape(cx,cy,r,mouth,mode==='dying'?-Math.PI/2:ang);
}
function drawGhost(g){
  const cx = ox+(g.x+.5)*ts, cy = oy+(g.y+.5)*ts, r = ts*0.42;
  if (mode==='dying') return;
  const scared = fright>0 && !g.wait;
  if (g.wait>0){ eyes(cx,cy,r,g); return; }
  ctx.fillStyle = scared ? (fright<2 && Math.floor(t*6)%2 ? '#fff' : '#2a3cff') : g.color;
  ctx.beginPath();
  ctx.moveTo(cx-r, cy+r); ctx.lineTo(cx-r, cy); ctx.arc(cx, cy, r, Math.PI, 0); ctx.lineTo(cx+r, cy+r);
  const n = 3, w = 2*r/n;
  for (let i=0;i<n;i++){
    const x0 = cx+r-i*w;
    ctx.quadraticCurveTo(x0-w*0.25, cy+r*0.55, x0-w*0.5, cy+r*0.85);
    ctx.quadraticCurveTo(x0-w*0.75, cy+r*1.15, x0-w, cy+r);
  }
  ctx.closePath(); ctx.fill();
  if (scared){
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cx-r*.3, cy-r*.2, r*.13, 0, 7); ctx.arc(cx+r*.3, cy-r*.2, r*.13, 0, 7); ctx.fill();
  } else eyes(cx,cy,r,g);
}
function eyes(cx,cy,r,g){
  for (const s of [-1,1]){
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(cx+s*r*.36, cy-r*.2, r*.27, r*.33, 0, 0, 7); ctx.fill();
    ctx.fillStyle='#1a1aff'; ctx.beginPath(); ctx.arc(cx+s*r*.36+g.dx*r*.14, cy-r*.2+g.dy*r*.14, r*.14, 0, 7); ctx.fill();
  }
}
function panel(lines){
  const w = Math.min(W-32, 340), h = 40+lines.length*34, x = (W-w)/2, y = (H-h)/2;
  ctx.fillStyle='rgba(5,5,26,.88)'; ctx.strokeStyle='#5567ff'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(x,y,w,h,16); ctx.fill(); ctx.stroke();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  lines.forEach((l,i)=>{ ctx.font = l.font; ctx.fillStyle = l.color; ctx.fillText(l.text, W/2, y+36+i*34, w-24); });
}
function overlay(big, small){
  panel([{text:big, font:'bold 24px ui-monospace,monospace', color:'#ffe600'},
         {text:small, font:'14px ui-monospace,monospace', color:'#fff'}]);
}
function resultScreen(){
  const lines = [{text:'FIN DE LA PARTIDA', font:'bold 22px ui-monospace,monospace', color:'#ffe600'}];
  if (nPlayers===1) lines.push({text:'Puntos: '+results[0], font:'18px ui-monospace,monospace', color:'#fff'});
  else {
    lines.push({text:'Jugador 1: '+results[0], font:'18px ui-monospace,monospace', color:'#fff'});
    lines.push({text:'Jugador 2: '+results[1], font:'18px ui-monospace,monospace', color:'#fff'});
    const w = results[0]===results[1] ? '¡Empate!' : '¡Gana el Jugador '+(results[0]>results[1]?1:2)+'!';
    lines.push({text:w, font:'bold 20px ui-monospace,monospace', color:'#7dff9b'});
  }
  lines.push({text:'Toca para volver al menú', font:'13px ui-monospace,monospace', color:'#8ea0ff'});
  panel(lines);
}
function drawMenu(){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#ffe600'; ctx.font='bold 40px ui-monospace,monospace'; ctx.fillText('COME COCOS', W/2, H*0.22);
  drawPacShape(W/2, H*0.33, 34, 0.15+0.3*Math.abs(Math.sin(t*6)), 0);
  ['#ff3b3b','#ff8fd0','#3be6ff'].forEach((c,i)=>{
    ctx.fillStyle=c; ctx.beginPath(); ctx.arc(W/2+60+i*34, H*0.33, 10, 0, 7); ctx.fill();
  });
  ctx.fillStyle='#ffe9b0'; for (let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(W/2-110+i*28, H*0.33, 4, 0, 7); ctx.fill(); }
  ctx.fillStyle='#8ea0ff'; ctx.font='14px ui-monospace,monospace'; ctx.fillText('Usa el joystick de abajo para girar', W/2, H*0.42);
  for (const b of buttons()){
    ctx.fillStyle='#ffe600'; ctx.beginPath(); ctx.roundRect(b.x,b.y,b.w,b.h,27); ctx.fill();
    ctx.fillStyle='#14141f'; ctx.font='bold 15px ui-monospace,monospace'; ctx.fillText(b.label, b.x+b.w/2, b.y+b.h/2, b.w-16);
  }
}

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05,(now-last)/1000); last = now;
  update(dt); draw(); requestAnimationFrame(loop);
}
freshPellets(); resetPositions();
requestAnimationFrame(loop);
</script>
</body>
</html>
