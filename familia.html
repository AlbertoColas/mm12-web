<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pasa el móvil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* Juego cooperativo de familia: pasar el móvil y responder preguntas de dificultad creciente entre todos. */
  :root{
    --bg:#1d1b4d; --card:#ffffff; --ink:#1d1b4d; --muted:#6b6a8f;
    --yellow:#ffd23f; --teal:#2ec4b6; --pink:#ff5d8f; --orange:#ff9f1c; --good:#2bb673; --bad:#e5484d;
    --font:'Baloo 2','Nunito','Trebuchet MS',system-ui,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:var(--font);font-size:18px;
    -webkit-user-select:none;user-select:none}
  body{padding-inline:16px;padding-block:16px}
  main{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-height:calc(100dvh - 32px)}
  h1,h2,p{margin:0}
  h1{font-size:2.4rem;line-height:1;font-weight:800;text-wrap:balance}
  h2{font-size:1.7rem;line-height:1.1;font-weight:800;text-wrap:balance}
  .muted{color:#c9c8ee}
  .grow{flex:1}
  .center{text-align:center}
  button,input{font:inherit}
  .btn{border:0;border-radius:18px;padding:14px 18px;font-weight:800;font-size:1.15rem;color:var(--ink);background:var(--yellow);
    box-shadow:0 5px 0 rgba(0,0,0,.25);cursor:pointer;width:100%}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
  .btn.ghost{background:transparent;color:#fff;box-shadow:none;border:2px solid rgba(255,255,255,.35)}
  .btn.good{background:var(--good);color:#fff}
  .btn.bad{background:var(--bad);color:#fff}
  .btn.small{width:auto;padding:8px 14px;font-size:1rem}
  .btn:disabled{opacity:.55;cursor:default}
  .card{background:var(--card);color:var(--ink);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:16px}
  .tag{align-self:flex-start;border-radius:999px;padding:2px 14px;font-weight:800;font-size:.95rem;color:#fff;letter-spacing:.04em;text-transform:uppercase}
  .row{display:flex;gap:8px;align-items:center}
  .row input{flex:1;min-width:0;border:3px solid #e3e2f5;border-radius:14px;padding:10px 14px;font-weight:700;color:var(--ink);background:#fff}
  .row input:focus{outline:3px solid var(--yellow);border-color:var(--yellow)}
  .x{border:0;background:#f0eff9;color:var(--muted);width:44px;height:44px;border-radius:14px;font-size:1.3rem;font-weight:800;cursor:pointer}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;border:3px solid #e3e2f5;background:#fff;color:var(--ink);border-radius:14px;padding:8px 0;font-weight:800;font-size:1.1rem;cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .label{font-weight:800;color:var(--muted);font-size:.9rem;text-transform:uppercase;letter-spacing:.06em}
  .scores{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border-radius:999px;padding:4px 12px;background:rgba(255,255,255,.12);font-weight:700;font-size:.95rem}
  .chip.on{background:var(--yellow);color:var(--ink)}
  .big{font-size:3.2rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .question{font-size:1.6rem;font-weight:800;line-height:1.15}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{border:3px solid #e3e2f5;background:#fff;color:var(--ink);border-radius:16px;padding:12px 14px;font-weight:700;font-size:1.15rem;text-align:left;cursor:pointer}
  .opt.ok{background:var(--good);border-color:var(--good);color:#fff}
  .opt.ko{background:var(--bad);border-color:var(--bad);color:#fff}
  .word{font-size:2.4rem;font-weight:800;text-align:center;padding:12px 0;text-wrap:balance}
  .stack{display:flex;flex-direction:column;gap:10px}
  .rank{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;background:#f3f2fc;font-weight:800}
  .rank.first{background:var(--yellow)}
  .rank .pos{font-size:1.6rem;width:2rem;text-align:center}
  .rank .nm{flex:1;min-width:0;overflow-wrap:anywhere}
  .rank .pts{font-variant-numeric:tabular-nums}
  .expl{margin:0;background:#f3f2fc;border-radius:14px;padding:12px 14px;font-size:1.05rem;line-height:1.3;color:var(--ink)}
  .msg{font-weight:800;font-size:1.2rem}
  .msg.good{color:var(--good)} .msg.bad{color:var(--bad)}
  @media (prefers-reduced-motion:no-preference){ .pop{animation:pop .25s ease-out} @keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}} }
</style>
</head>
<body>
<main id="app"></main>

const CATS = {
  'Ciencia':'#2ec4b6','Geografía':'#3a86ff','Historia':'#ff9f1c','Arte y letras':'#ff5d8f',
  'Naturaleza':'#2bb673','Deportes':'#8e5cff','Cultura general':'#6b6a8f',
};

const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Rotación: las preguntas ya vistas se guardan en el móvil y no vuelven a salir hasta agotar las de ese nivel.
const hash = t => { let h = 5381; for (const c of t) h = ((h*33) ^ c.charCodeAt(0)) >>> 0; return h.toString(36); };
const SEEN_KEY = 'familia-vistas';
const seen = new Set(); let lastCat = null;
try { JSON.parse(localStorage.getItem(SEEN_KEY) || '[]').forEach(h => seen.add(h)); } catch(e){}
const saveSeen = () => { try { localStorage.setItem(SEEN_KEY, JSON.stringify([...seen])); } catch(e){} };
function pickQuestion(l){
  const all = TRIVIA.filter(q => q[5]===l);
  let fresh = all.filter(q => !seen.has(hash(q[1])));
  if (!fresh.length){ all.forEach(q => seen.delete(hash(q[1]))); fresh = all; }  // vuelta completa: se reinicia el nivel
  const diff = fresh.filter(q => q[0]!==lastCat), from = diff.length ? diff : fresh;   // y no repetimos tema seguido
  const q = from[Math.floor(Math.random()*from.length)];
  seen.add(hash(q[1])); lastCat = q[0]; saveSeen();
  return q;
}

const S = { screen:'setup', names:['Jugador 1','Jugador 2'], rounds:3, players:[], turn:0, card:null, score:0, record:0 };
const app = document.getElementById('app');
const cur = () => S.players[S.turn % S.players.length];
const total = () => S.rounds * S.players.length;
const roundOf = t => Math.floor(t / S.players.length) + 1;
// La dificultad sube a lo largo de la partida: nivel 1 al principio, hasta nivel 4 al final.
const levelOf = t => 1 + Math.min(3, Math.floor((roundOf(t)-1) * 4 / S.rounds));
const level = () => levelOf(S.turn);
const value = () => 2 * level();
const maxScore = () => { let m = 0; for (let t=0;t<total();t++) m += 2*levelOf(t); return m; };
const stars = l => '★'.repeat(l) + '☆'.repeat(4-l);
const recKey = () => 'familia-record-' + S.rounds + '-' + S.names.length;
const readRecord = () => { try { return +localStorage.getItem(recKey()) || 0; } catch(e){ return 0; } };
const saveRecord = v => { try { localStorage.setItem(recKey(), String(v)); } catch(e){} };

function header(){
  return `<div class="scores"><span class="chip on">Equipo: ${S.score} pts</span>
    <span class="chip">Nivel ${stars(level())}</span><span class="chip">Turno de ${esc(cur().name)}</span></div>`;
}
function show(html){ app.innerHTML = html; app.firstElementChild && app.firstElementChild.classList.add('pop'); window.scrollTo(0,0); }

// ---------- Preparar partida ----------
function setup(){
  S.screen = 'setup';
  show(`<div class="stack">
    <h1>🎲 Pasa el móvil</h1>
    <p class="muted">Todos sois un equipo y tenéis que sumar los máximos puntos posibles. Cada ronda trae preguntas más difíciles.</p>
  </div>
  <div class="card">
    <div class="label">Jugadores (2 a 6)</div>
    <div class="stack" id="names">${S.names.map((n,i)=>`<div class="row">
      <input id="name-${i}" value="${esc(n)}" maxlength="14" aria-label="Nombre del jugador ${i+1}">
      <button class="x" data-del="${i}" aria-label="Quitar jugador ${i+1}" ${S.names.length<=2?'disabled':''}>×</button></div>`).join('')}</div>
    <button class="btn small" id="add" ${S.names.length>=6?'disabled':''}>+ Añadir jugador</button>
    <div class="label">Rondas (preguntas por jugador)</div>
    <div class="seg">${[2,3,5,8].map(r=>`<button data-r="${r}" aria-pressed="${r===S.rounds}">${r}</button>`).join('')}</div>
  </div>
  <div class="grow"></div>
  <button class="btn" id="go">¡A jugar!</button>`);
  S.names.forEach((_,i)=>{ document.getElementById('name-'+i).addEventListener('input', e => { S.names[i] = e.target.value; }); });
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { S.names.splice(+b.dataset.del,1); setup(); });
  document.getElementById('add').onclick = () => { S.names.push('Jugador '+(S.names.length+1)); setup(); };
  app.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { S.rounds = +b.dataset.r; setup(); });
  document.getElementById('go').onclick = () => {
    S.players = S.names.map((n,i)=>({name:(n.trim()||'Jugador '+(i+1))}));
    S.turn = 0; S.score = 0; S.record = readRecord(); turnScreen();
  };
}

// ---------- Turno ----------
function turnScreen(){
  S.screen = 'turn';
  const harder = S.turn>0 && S.turn % S.players.length === 0 && level() > levelOf(S.turn-1);
  show(`<div class="stack">${header()}<p class="muted">Ronda ${roundOf(S.turn)} de ${S.rounds}${S.record?` · Récord: ${S.record} pts`:''}</p></div>
  <div class="grow center" style="display:flex;flex-direction:column;justify-content:center;gap:12px">
    ${harder?`<p class="msg" style="color:var(--yellow)">⬆ ¡Sube la dificultad! Nivel ${level()}</p>`:''}
    <p class="muted">Le toca a</p>
    <div class="big" style="overflow-wrap:anywhere">${esc(cur().name)}</div>
    <p class="muted">Esta pregunta vale <b>${value()} puntos</b> para el equipo</p>
  </div>
  <button class="btn" id="draw">Ver la pregunta</button>`);
  document.getElementById('draw').onclick = questionScreen;
}

// ---------- Pregunta ----------
function questionScreen(){
  S.screen = 'card';
  const [cat,q,opts,ans,expl] = pickQuestion(level());
  const isVF = opts.length===2;
  const order = isVF ? opts.map((o,i)=>({o,ok:i===ans})) : shuffle(opts.map((o,i)=>({o,ok:i===ans})));
  show(`<div class="stack">${header()}</div>
  <div class="card"><span class="tag" style="background:${CATS[cat]}">${esc(cat)} · +${value()}</span>
    <div class="question">${esc(q)}</div>
    <p style="color:var(--muted);font-size:.95rem;margin:0">Hablad entre todos y elegid una respuesta.</p>
    <div class="opts">${order.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.o)}</button>`).join('')}</div>
    <div id="res"></div>
  </div>
  <div class="grow"></div>`);
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const ok = order[+b.dataset.i].ok, right = order.find(o=>o.ok).o;
    app.querySelectorAll('.opt').forEach((x,j)=>{ x.disabled = true; if (order[j].ok) x.classList.add('ok'); });
    if (!ok) b.classList.add('ko'); else S.score += value();
    document.getElementById('res').innerHTML = `
      <p class="msg ${ok?'good':'bad'}">${ok?'¡Correcto! +'+value()+' puntos para el equipo':'¡Uy! La respuesta correcta era «'+esc(right)+'».'}</p>
      <p class="expl">${esc(expl)}</p>
      <button class="btn" id="next">Siguiente</button>`;
    document.getElementById('next').onclick = nextTurn;
  });
}

// ---------- Siguiente / final ----------
function nextTurn(){
  S.turn++;
  if (S.turn >= total()) finalScreen(); else turnScreen();
}
function finalScreen(){
  S.screen = 'final';
  const max = maxScore(), pct = Math.round(100*S.score/max), prev = readRecord(), isRecord = S.score > prev;
  if (isRecord) saveRecord(S.score);
  const verdict = pct>=90 ? '¡Equipo de leyenda!' : pct>=70 ? '¡Gran equipo!' : pct>=40 ? '¡Buen trabajo, equipo!' : '¡Ánimo! La próxima, más.';
  show(`<div class="stack center"><div class="big">🏆</div><h1>${verdict}</h1></div>
  <div class="card center" style="gap:8px">
    <div class="label">Puntos del equipo</div>
    <div class="big" style="color:var(--ink)">${S.score}</div>
    <p style="color:var(--muted)">de ${max} posibles (${pct}%)</p>
    ${isRecord ? '<p class="msg good">🎉 ¡Nuevo récord!</p>' : (prev ? `<p style="color:var(--muted)">Récord: ${prev} pts</p>` : '')}
  </div>
  <div class="grow"></div>
  <button class="btn" id="again">Jugar otra vez</button>
  <button class="btn ghost" id="change">Cambiar jugadores</button>`);
  document.getElementById('again').onclick = () => { S.turn=0; S.score=0; S.record=readRecord(); turnScreen(); };
  document.getElementById('change').onclick = setup;
}
setup();
</script>
