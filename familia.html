<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pasa el móvil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* Juego cooperativo de familia: pasar el móvil, sacar carta (pregunta, mímica o reto) y sumar puntos entre todos. */
  :root{
    --bg:#1d1b4d; --card:#ffffff; --ink:#1d1b4d; --muted:#6b6a8f;
    --yellow:#ffd23f; --teal:#2ec4b6; --pink:#ff5d8f; --orange:#ff9f1c; --good:#2bb673; --bad:#e5484d;
    --font:'Baloo 2','Nunito','Trebuchet MS',system-ui,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:var(--font);font-size:18px;
    -webkit-user-select:none;user-select:none}
  body{padding-inline:16px;padding-block:16px}
  main{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-height:calc(100dvh - 32px)}
  h1,h2,p{margin:0}
  h1{font-size:2.4rem;line-height:1;font-weight:800;text-wrap:balance}
  h2{font-size:1.7rem;line-height:1.1;font-weight:800;text-wrap:balance}
  .muted{color:#c9c8ee}
  .grow{flex:1}
  .center{text-align:center}
  button,input{font:inherit}
  .btn{border:0;border-radius:18px;padding:14px 18px;font-weight:800;font-size:1.15rem;color:var(--ink);background:var(--yellow);
    box-shadow:0 5px 0 rgba(0,0,0,.25);cursor:pointer;width:100%}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
  .btn.ghost{background:transparent;color:#fff;box-shadow:none;border:2px solid rgba(255,255,255,.35)}
  .btn.good{background:var(--good);color:#fff}
  .btn.bad{background:var(--bad);color:#fff}
  .btn.small{width:auto;padding:8px 14px;font-size:1rem}
  .btn:disabled{opacity:.55;cursor:default}
  .card{background:var(--card);color:var(--ink);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:16px}
  .tag{align-self:flex-start;border-radius:999px;padding:2px 14px;font-weight:800;font-size:.95rem;color:#fff;letter-spacing:.04em;text-transform:uppercase}
  .row{display:flex;gap:8px;align-items:center}
  .row input{flex:1;min-width:0;border:3px solid #e3e2f5;border-radius:14px;padding:10px 14px;font-weight:700;color:var(--ink);background:#fff}
  .row input:focus{outline:3px solid var(--yellow);border-color:var(--yellow)}
  .x{border:0;background:#f0eff9;color:var(--muted);width:44px;height:44px;border-radius:14px;font-size:1.3rem;font-weight:800;cursor:pointer}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;border:3px solid #e3e2f5;background:#fff;color:var(--ink);border-radius:14px;padding:8px 0;font-weight:800;font-size:1.1rem;cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .label{font-weight:800;color:var(--muted);font-size:.9rem;text-transform:uppercase;letter-spacing:.06em}
  .scores{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border-radius:999px;padding:4px 12px;background:rgba(255,255,255,.12);font-weight:700;font-size:.95rem}
  .chip.on{background:var(--yellow);color:var(--ink)}
  .big{font-size:3.2rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .question{font-size:1.6rem;font-weight:800;line-height:1.15}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{border:3px solid #e3e2f5;background:#fff;color:var(--ink);border-radius:16px;padding:12px 14px;font-weight:700;font-size:1.15rem;text-align:left;cursor:pointer}
  .opt.ok{background:var(--good);border-color:var(--good);color:#fff}
  .opt.ko{background:var(--bad);border-color:var(--bad);color:#fff}
  .word{font-size:2.4rem;font-weight:800;text-align:center;padding:12px 0;text-wrap:balance}
  .stack{display:flex;flex-direction:column;gap:10px}
  .rank{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;background:#f3f2fc;font-weight:800}
  .rank.first{background:var(--yellow)}
  .rank .pos{font-size:1.6rem;width:2rem;text-align:center}
  .rank .nm{flex:1;min-width:0;overflow-wrap:anywhere}
  .rank .pts{font-variant-numeric:tabular-nums}
  .msg{font-weight:800;font-size:1.2rem}
  .msg.good{color:var(--good)} .msg.bad{color:var(--bad)}
  @media (prefers-reduced-motion:no-preference){ .pop{animation:pop .25s ease-out} @keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}} }
</style>
</head>
<body>
<main id="app"></main>
<script>
// [pregunta, opciones, índice correcto, nivel de dificultad 1-4]
const TRIVIA = [
  // Nivel 1
  ['¿Cuántas patas tiene una araña?', ['6','8','10','12'], 1, 1],
  ['¿Cuál es la capital de Francia?', ['Lyon','Marsella','París','Niza'], 2, 1],
  ['¿Qué color sale al mezclar azul y amarillo?', ['Verde','Naranja','Morado','Marrón'], 0, 1],
  ['¿Cuántos jugadores de un equipo de fútbol hay a la vez en el campo?', ['9','10','11','12'], 2, 1],
  ['¿Cuántos colores tiene el arcoíris?', ['5','6','7','8'], 2, 1],
  ['¿Cuántas estaciones tiene el año?', ['3','4','5','6'], 1, 1],
  ['¿Cuántos lados tiene un hexágono?', ['5','6','7','8'], 1, 1],
  ['¿Qué instrumento tiene teclas blancas y negras?', ['Violín','Trompeta','Piano','Flauta'], 2, 1],
  ['¿Qué planeta se conoce como el planeta rojo?', ['Venus','Mercurio','Neptuno','Marte'], 3, 1],
  ['¿Qué gas necesitamos respirar para vivir?', ['Oxígeno','Helio','Nitrógeno','Hidrógeno'], 0, 1],
  // Nivel 2
  ['¿Cuál es el planeta más grande del sistema solar?', ['Júpiter','Saturno','Marte','Tierra'], 0, 2],
  ['¿Quién pintó «Las Meninas»?', ['Goya','Velázquez','Picasso','Dalí'], 1, 2],
  ['¿Cuántos días tiene un año bisiesto?', ['364','365','366','367'], 2, 2],
  ['¿Cuál es el río más largo de la península ibérica?', ['Ebro','Duero','Guadalquivir','Tajo'], 3, 2],
  ['¿Quién escribió «Don Quijote de la Mancha»?', ['Lope de Vega','Cervantes','Quevedo','Bécquer'], 1, 2],
  ['¿Cuál es el hueso más largo del cuerpo humano?', ['Fémur','Tibia','Húmero','Costilla'], 0, 2],
  ['¿Cuántos huesos tiene aproximadamente un adulto?', ['106','206','306','406'], 1, 2],
  ['¿Qué metal es líquido a temperatura ambiente?', ['Mercurio','Hierro','Plata','Cobre'], 0, 2],
  ['¿En qué año llegó el ser humano a la Luna?', ['1959','1965','1969','1975'], 2, 2],
  ['¿Cuál es el país más grande del mundo?', ['China','Canadá','Estados Unidos','Rusia'], 3, 2],
  ['¿En qué año llegó Colón a América?', ['1392','1492','1592','1692'], 1, 2],
  ['¿Cuál es el órgano más grande del cuerpo humano?', ['El hígado','El corazón','La piel','El pulmón'], 2, 2],
  // Nivel 3
  ['¿Cuál es el símbolo químico del oro?', ['Ag','Au','Fe','Go'], 1, 3],
  ['¿Quién compuso «Las cuatro estaciones»?', ['Mozart','Beethoven','Vivaldi','Bach'], 2, 3],
  ['¿Cuál es la capital de Australia?', ['Sídney','Melbourne','Canberra','Perth'], 2, 3],
  ['¿En qué año cayó el Muro de Berlín?', ['1979','1985','1989','1991'], 2, 3],
  ['¿Cuántos corazones tiene un pulpo?', ['1','2','3','8'], 2, 3],
  ['¿Cuál es la montaña más alta de España?', ['Mulhacén','Aneto','Teide','Veleta'], 2, 3],
  ['¿Cuál es el hueso más pequeño del cuerpo humano?', ['Yunque','Estribo','Martillo','Falange'], 1, 3],
  ['¿Quién pintó «La persistencia de la memoria»?', ['Miró','Dalí','Picasso','Magritte'], 1, 3],
  ['¿Cuál es la capital de Canadá?', ['Toronto','Vancouver','Montreal','Ottawa'], 3, 3],
  ['¿Quién descubrió la penicilina?', ['Pasteur','Fleming','Curie','Koch'], 1, 3],
  ['¿Quién escribió «Cien años de soledad»?', ['García Márquez','Vargas Llosa','Borges','Cortázar'], 0, 3],
  ['¿Cuál es el desierto cálido más grande del mundo?', ['Gobi','Kalahari','Sáhara','Atacama'], 2, 3],
  // Nivel 4
  ['¿Cuál es el elemento más abundante del universo?', ['Oxígeno','Hidrógeno','Helio','Carbono'], 1, 4],
  ['¿En qué año comenzó la Revolución Francesa?', ['1689','1750','1789','1815'], 2, 4],
  ['¿Cuál es el río más largo de Europa?', ['Danubio','Rin','Volga','Támesis'], 2, 4],
  ['¿Cuál es el número atómico del carbono?', ['4','6','8','12'], 1, 4],
  ['¿En qué batalla fue derrotado definitivamente Napoleón en 1815?', ['Austerlitz','Trafalgar','Waterloo','Leipzig'], 2, 4],
  ['¿Cómo se llama el punto más profundo de los océanos?', ['Fosa de las Marianas','Fosa de Puerto Rico','Fosa de Java','Fosa de Tonga'], 0, 4],
  ['¿Quién fue el primer ser humano en viajar al espacio?', ['Neil Armstrong','Yuri Gagarin','Buzz Aldrin','John Glenn'], 1, 4],
  ['¿Cuántos elementos tiene la tabla periódica actual?', ['92','108','118','128'], 2, 4],
  ['¿Qué país tiene más islas del mundo?', ['Indonesia','Filipinas','Suecia','Japón'], 2, 4],
  ['¿Cuál es la lengua más hablada del mundo como lengua materna?', ['Inglés','Chino mandarín','Español','Hindi'], 1, 4],
];
const MIMICA_FACIL = ['Elefante','Pizza','Bailar flamenco','Dormir','Futbolista','Cocinero','Astronauta','Mono','Lavarse los dientes',
  'Pescar','Tocar la guitarra','Conducir un coche','Montar en bici','Pingüino','Peluquero','Nadar','Payaso','Robot','Dinosaurio',
  'Jugar al tenis','Gallina','Surfear','Tomar un helado','Médico','Mago','Hacer una tarta','Serpiente','Boxeador','Fantasma','Esquiar'];
const MIMICA_DIFICIL = ['Un camarero con la bandeja llena','Atrapar una mosca','Caminar contra el viento','Un astronauta flotando',
  'Planchar una camisa','Un bebé aprendiendo a andar','Ir al dentista','Hacer cola en el supermercado','Jugar al ajedrez',
  'Montar una tienda de campaña','Un gato que se cae de la cama','Un torero','Cambiar un pañal','Escalar una montaña','Una tormenta'];
const RETOS_FACIL = [
  'Di tres veces seguidas sin fallar: «Tres tristes tigres tragaban trigo en un trigal».',
  'Aguanta 20 segundos a la pata coja.',
  'Nombra 5 animales en 10 segundos.',
  'Nombra 5 países de Europa en 10 segundos.',
  'Cuenta del 20 al 0 de dos en dos sin equivocarte.',
  'Haz 10 sentadillas contando en voz alta.',
  'Nombra 5 frutas en 8 segundos.',
  'Habla con voz de robot durante 15 segundos.',
  'Cuenta lo que hiciste ayer en exactamente 3 frases.',
  'Di el abecedario al revés desde la Z hasta la T.',
];
const RETOS_DIFICIL = [
  'Di tres veces seguidas sin fallar: «El perro de San Roque no tiene rabo porque Ramón Ramírez se lo ha robado».',
  'Nombra 8 animales en 10 segundos.',
  'Di el abecedario al revés desde la Z hasta la M.',
  'Nombra 6 países de África en 15 segundos.',
  'Haz 15 sentadillas contando en voz alta.',
  'Cuenta de 3 en 3 desde 0 hasta 36 sin equivocarte.',
  'Aguanta 30 segundos a la pata coja.',
  'Nombra 7 capitales de Europa en 15 segundos.',
  'Di 6 palabras que empiecen por «ca» en 10 segundos.',
  'Cuenta del 100 al 70 de dos en dos sin equivocarte.',
];
const TYPES = {
  trivia: {label:'Pregunta', color:'var(--teal)'},
  mimica: {label:'Mímica',   color:'var(--pink)'},
  reto:   {label:'Reto',     color:'var(--orange)'},
};

const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const deck = arr => { let d=[]; return () => { if(!d.length) d = shuffle(arr.slice()); return d.pop(); }; };
const triviaDecks = [1,2,3,4].map(l => deck(TRIVIA.filter(q => q[3]===l)));
const nextMimica = [deck(MIMICA_FACIL), deck(MIMICA_DIFICIL)], nextReto = [deck(RETOS_FACIL), deck(RETOS_DIFICIL)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const S = { screen:'setup', names:['Jugador 1','Jugador 2'], rounds:3, players:[], turn:0, card:null, score:0, record:null };
const app = document.getElementById('app');
let timer = null;
const stopTimer = () => { if (timer){ clearInterval(timer); timer = null; } };
const cur = () => S.players[S.turn % S.players.length];
const total = () => S.rounds * S.players.length;
const roundOf = t => Math.floor(t / S.players.length) + 1;
// La dificultad sube a lo largo de la partida: nivel 1 al principio, hasta nivel 4 al final.
const levelOf = t => 1 + Math.min(3, Math.floor((roundOf(t)-1) * 4 / S.rounds));
const level = () => levelOf(S.turn);
const value = () => 2 * level();
const maxScore = () => { let m = 0; for (let t=0;t<total();t++) m += 2*levelOf(t); return m; };
const stars = l => '★'.repeat(l) + '☆'.repeat(4-l);
const recKey = () => 'familia-record-' + S.rounds + '-' + S.names.length;
const readRecord = () => { try { return +localStorage.getItem(recKey()) || 0; } catch(e){ return 0; } };
const saveRecord = v => { try { localStorage.setItem(recKey(), String(v)); } catch(e){} };

function header(){
  return `<div class="scores"><span class="chip on">Equipo: ${S.score} pts</span>
    <span class="chip">Nivel ${stars(level())}</span><span class="chip">Turno de ${esc(cur().name)}</span></div>`;
}
function show(html){ stopTimer(); app.innerHTML = html; app.firstElementChild && app.firstElementChild.classList.add('pop'); window.scrollTo(0,0); }

// ---------- Preparar partida ----------
function setup(){
  S.screen = 'setup';
  show(`<div class="stack">
    <h1>🎲 Pasa el móvil</h1>
    <p class="muted">Todos sois un equipo. Pregunta, mímica o reto: ¡sumad los máximos puntos posibles! Cada ronda es más difícil.</p>
  </div>
  <div class="card">
    <div class="label">Jugadores (2 a 6)</div>
    <div class="stack" id="names">${S.names.map((n,i)=>`<div class="row">
      <input id="name-${i}" value="${esc(n)}" maxlength="14" aria-label="Nombre del jugador ${i+1}">
      <button class="x" data-del="${i}" aria-label="Quitar jugador ${i+1}" ${S.names.length<=2?'disabled':''}>×</button></div>`).join('')}</div>
    <button class="btn small" id="add" ${S.names.length>=6?'disabled':''}>+ Añadir jugador</button>
    <div class="label">Rondas (turnos por jugador)</div>
    <div class="seg">${[2,3,5,8].map(r=>`<button data-r="${r}" aria-pressed="${r===S.rounds}">${r}</button>`).join('')}</div>
  </div>
  <div class="grow"></div>
  <button class="btn" id="go">¡A jugar!</button>`);
  S.names.forEach((_,i)=>{ document.getElementById('name-'+i).addEventListener('input', e => { S.names[i] = e.target.value; }); });
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { S.names.splice(+b.dataset.del,1); setup(); });
  document.getElementById('add').onclick = () => { S.names.push('Jugador '+(S.names.length+1)); setup(); };
  app.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { S.rounds = +b.dataset.r; setup(); });
  document.getElementById('go').onclick = () => {
    S.players = S.names.map((n,i)=>({name:(n.trim()||'Jugador '+(i+1))}));
    S.turn = 0; S.score = 0; S.record = readRecord(); turnScreen();
  };
}

// ---------- Turno ----------
function turnScreen(){
  S.screen = 'turn';
  const newRound = S.turn % S.players.length === 0;
  const harder = newRound && S.turn>0 && level() > levelOf(S.turn-1);
  show(`<div class="stack">${header()}<p class="muted">Ronda ${roundOf(S.turn)} de ${S.rounds}${S.record?` · Récord: ${S.record} pts`:''}</p></div>
  <div class="grow center" style="display:flex;flex-direction:column;justify-content:center;gap:12px">
    ${harder?`<p class="msg" style="color:var(--yellow)">⬆ ¡Sube la dificultad! Nivel ${level()}</p>`:''}
    <p class="muted">Le toca a</p>
    <div class="big" style="overflow-wrap:anywhere">${esc(cur().name)}</div>
    <p class="muted">Cada carta vale <b>${value()} puntos</b> para el equipo</p>
  </div>
  <button class="btn" id="draw">🃏 Sacar carta</button>`);
  document.getElementById('draw').onclick = drawCard;
}
function drawCard(){
  const r = Math.random(), L = level();
  const type = r < .45 ? 'trivia' : r < .72 ? 'mimica' : 'reto';
  const hard = L >= 3 ? 1 : 0;
  if (type==='trivia'){
    const [q,opts,ans] = triviaDecks[L-1]();
    S.card = {type, q, order: shuffle(opts.map((o,i)=>({o,ok:i===ans})))};
  } else if (type==='mimica') S.card = {type, word:nextMimica[hard](), secs:[60,50,40,30][L-1]};
  else S.card = {type, text:nextReto[hard]()};
  cardScreen();
}
const tag = t => `<span class="tag" style="background:${TYPES[t].color}">${TYPES[t].label} · +${value()}</span>`;

function cardScreen(){
  const c = S.card;
  if (c.type==='trivia') return triviaScreen(c);
  if (c.type==='mimica') return mimicaIntro(c);
  retoScreen(c);
}

// Pregunta
function triviaScreen(c){
  S.screen = 'card';
  show(`<div class="stack">${header()}</div>
  <div class="card">${tag('trivia')}<div class="question">${esc(c.q)}</div>
    <p class="muted" style="color:var(--muted);font-size:.95rem">Hablad entre todos y elegid una respuesta.</p>
    <div class="opts">${c.order.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.o)}</button>`).join('')}</div>
    <div id="res"></div>
  </div>
  <div class="grow"></div>`);
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const i = +b.dataset.i, ok = c.order[i].ok;
    app.querySelectorAll('.opt').forEach((x,j)=>{ x.disabled = true; if (c.order[j].ok) x.classList.add('ok'); });
    if (!ok) b.classList.add('ko'); else S.score += value();
    document.getElementById('res').innerHTML = `<p class="msg ${ok?'good':'bad'}">${ok?'¡Correcto! +'+value()+' puntos para el equipo':'¡Uy! La buena era la verde.'}</p>
      <button class="btn" id="next" style="margin-top:12px">Siguiente</button>`;
    document.getElementById('next').onclick = nextTurn;
  });
}

// Mímica
function mimicaIntro(c){
  S.screen = 'card';
  show(`<div class="stack">${header()}</div>
  <div class="card">${tag('mimica')}
    <h2>${esc(cur().name)}, haz mímica</h2>
    <p>Solo puedes mirar tú. Sin hablar: ¡que el equipo adivine antes de que acabe el tiempo (${c.secs} s)!</p>
    <button class="btn" id="see">👀 Ver mi palabra</button>
  </div><div class="grow"></div>`);
  document.getElementById('see').onclick = () => mimicaPlay(c);
}
function mimicaPlay(c){
  show(`<div class="stack">${header()}</div>
  <div class="card">${tag('mimica')}
    <div class="word" id="word">${esc(c.word)}</div>
    <div class="center big" id="clock">${c.secs}</div>
    <button class="btn" id="start">▶ Empezar (${c.secs} s)</button>
    <div class="stack" id="who" hidden>
      <button class="btn good" id="yes">¡Lo adivinamos! +${value()}</button>
      <button class="btn bad" id="no">No lo adivinamos</button>
    </div>
  </div><div class="grow"></div>`);
  const clock = document.getElementById('clock');
  const finish = () => {
    stopTimer(); clock.textContent = '0'; if (navigator.vibrate) navigator.vibrate(200);
    document.getElementById('word').insertAdjacentHTML('afterend','<p class="msg bad center">¡Se acabó el tiempo!</p>');
  };
  document.getElementById('start').onclick = e => {
    e.target.hidden = true; document.getElementById('who').hidden = false;
    const end = Date.now()+c.secs*1000;
    timer = setInterval(() => {
      const left = Math.ceil((end-Date.now())/1000);
      if (left<=0) finish(); else clock.textContent = left;
    }, 250);
  };
  document.getElementById('yes').onclick = () => { S.score += value(); nextTurn(); };
  document.getElementById('no').onclick = nextTurn;
}

// Reto
function retoScreen(c){
  S.screen = 'card';
  show(`<div class="stack">${header()}</div>
  <div class="card">${tag('reto')}
    <h2>${esc(cur().name)}, tu reto</h2>
    <div class="question">${esc(c.text)}</div>
    <div class="label">Que decida el resto del equipo</div>
    <button class="btn good" id="ok">¡Lo logró! +${value()}</button>
    <button class="btn bad" id="ko">No lo logró</button>
  </div><div class="grow"></div>`);
  document.getElementById('ok').onclick = () => { S.score += value(); nextTurn(); };
  document.getElementById('ko').onclick = nextTurn;
}

// ---------- Siguiente / final ----------
function nextTurn(){
  S.turn++;
  if (S.turn >= total()) finalScreen(); else turnScreen();
}
function finalScreen(){
  S.screen = 'final';
  const max = maxScore(), pct = Math.round(100*S.score/max), prev = readRecord(), isRecord = S.score > prev;
  if (isRecord) saveRecord(S.score);
  const verdict = pct>=90 ? '¡Equipo de leyenda!' : pct>=70 ? '¡Gran equipo!' : pct>=40 ? '¡Buen trabajo, equipo!' : '¡Ánimo! La próxima, más.';
  show(`<div class="stack center"><div class="big">🏆</div><h1>${verdict}</h1></div>
  <div class="card center" style="gap:8px">
    <div class="label">Puntos del equipo</div>
    <div class="big" style="color:var(--ink)">${S.score}</div>
    <p style="color:var(--muted)">de ${max} posibles (${pct}%)</p>
    ${isRecord ? '<p class="msg good">🎉 ¡Nuevo récord!</p>' : (prev ? `<p style="color:var(--muted)">Récord: ${prev} pts</p>` : '')}
  </div>
  <div class="grow"></div>
  <button class="btn" id="again">Jugar otra vez</button>
  <button class="btn ghost" id="change">Cambiar jugadores</button>`);
  document.getElementById('again').onclick = () => { S.turn=0; S.score=0; S.record=readRecord(); turnScreen(); };
  document.getElementById('change').onclick = setup;
}
setup();
</script>
</body>
</html>
